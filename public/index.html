<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Unidades y Tool Crib</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
header{background:#000;color:#fff;padding:20px;border-bottom:4px solid orange}
.container{padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px;margin-top:5px;margin-bottom:15px}
button{background:orange;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.badge{background:#eee;padding:8px 12px;border-radius:20px}
</style>
</head>
<body>

<header>
<h1>CONTROL DE UNIDADES Y TOOL CRIB</h1>
<p>Mantenimiento IBS</p>
</header>

<div class="container">

<div class="card">
<h2>Solicitud de préstamo</h2>

<div class="grid">
<div>
<label>Empresa</label>
<input type="text" placeholder="Empresa">
</div>

<div>
<label>OP / Referencia</label>
<input type="text" placeholder="OP">
</div>

<div>
<label>Buscar empleado</label>
<input type="text" placeholder="Número o nombre">
</div>

<div>
<label>Cantidad de técnicos</label>
<input type="number">
</div>
</div>

<label>Foto de OP</label>
<input type="file">

<label>Número de licencia</label>
<input type="text">

<label>Foto licencia</label>
<input type="file">

<label>¿Lleva remolque?</label>
<select>
<option>No</option>
<option>Sí</option>
</select>

<button>Crear solicitud</button>

</div>

<div class="card">
<h2>Estado de solicitudes</h2>

<table width="100%" border="0">
<tr>
<th>Folio</th>
<th>Empresa</th>
<th>Estado</th>
<th>Unidad asignada</th>
</tr>

<tr>
<td>UNI-001</td>
<td>GCC</td>
<td><span class="badge">SOLICITADO</span></td>
<td>Pendiente Mtto</td>
</tr>
</table>

</div>

<div class="card">
<h2>Checklist minero obligatorio</h2>

<h3>Nivel de combustible</h3>
<p>E=0% | 1/4=25% | 1/2=50% | 3/4=75% | F=100%</p>

<input type="range" min="0" max="100" value="50">

<div class="grid">

<div>
<label>Luces</label>
<select>
<option>Sí aplica</option>
<option>No aplica</option>
</select>
</div>

<div>
<label>Intermitentes</label>
<select>
<option>Sí aplica</option>
<option>No aplica</option>
</select>
</div>

<div>
<label>Llanta extra</label>
<select>
<option>Sí aplica</option>
<option>No aplica</option>
</select>
</div>

<div>
<label>Póliza seguro</label>
<select>
<option>Sí aplica</option>
<option>No aplica</option>
</select>
</div>

</div>

<label>Fotos entrega</label>
<input type="file" multiple>

<label>Fotos recepción</label>
<input type="file" multiple>

<label>Firma técnico</label>
<button>Firmar</button>

<label>Firma mantenimiento</label>
<button>Firmar</button>

</div>

<div class="card">
<h2>Reporte percance / daño</h2>

<textarea rows="6" placeholder="Descripción de hechos"></textarea>

<label>Fotos daño</label>
<input type="file" multiple>

<button>Generar PDF</button>

</div>

</div>

</body>
</html>
