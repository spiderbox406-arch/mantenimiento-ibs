<style>

*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1f2328}button{border:0;border-radius:14px;padding:11px 15px;font-weight:900;font-size:14px;cursor:pointer;margin:4px}.btn-orange{background:var(--orange);color:white}.btn-dark{background:#222;color:white}.btn-green{background:var(--green);color:white}.btn-blue{background:var(--blue);color:white}.btn-red{background:var(--red);color:white}.btn-gray{background:#666;color:white}.btn-purple{background:var(--purple);color:white}.btn-light{background:#eef1f4;color:#222;border:1px solid var(--line)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:white}textarea{min-height:82px;resize:vertical}label{font-weight:900;font-size:13px;color:#555;display:block;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.muted{color:#666;font-size:13px}.login-page{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:radial-gradient(circle at 20% 20%, rgba(255,106,0,.35), transparent 28%),linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.78),rgba(0,0,0,.46)),url('https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1800&q=80');background-size:cover;background-position:center}.login-left{display:flex;flex-direction:column;justify-content:center;padding:70px;color:white}.ibs-logo-wrap{background:white;border:4px solid var(--orange);border-radius:18px;padding:10px 18px;width:max-content;box-shadow:0 18px 55px #0008;margin-bottom:34px}.login-title{font-size:54px;line-height:1;margin:0 0 16px;font-weight:900}.login-title strong{color:var(--orange)}.login-subtitle{font-size:20px;color:#e5e5e5;max-width:720px;line-height:1.48}.machine-strip{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:12px;max-width:760px;margin-top:28px}.machine-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(5px);border-radius:18px;padding:16px;box-shadow:0 14px 40px #0005}.machine-card .ico{font-size:34px;display:block;margin-bottom:8px}.machine-card b{display:block;color:white}.machine-card small{display:block;color:#ccc;margin-top:5px}.login-right{display:flex;align-items:center;justify-content:center;padding:30px}.login-card{width:100%;max-width:430px;background:rgba(255,255,255,.97);border-radius:28px;padding:30px;box-shadow:0 26px 80px #000a;border-top:9px solid var(--orange)}.system-online{display:flex;align-items:center;gap:8px;font-size:13px;color:#0f8a4b;font-weight:900;margin-bottom:14px}.dot-online{width:10px;height:10px;border-radius:50%;background:#0f8a4b;box-shadow:0 0 0 5px rgba(15,138,75,.12)}.login-card h2{margin:0;font-size:30px}.login-card p{color:#666;margin:8px 0 20px}.login-card button{width:100%;margin-top:14px}.login-footer{text-align:center;margin-top:18px;font-size:12px;color:#777}header{background:#111;color:white;padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;border-bottom:4px solid var(--orange);box-shadow:0 7px 22px #0003}.header-logo{background:white;border:3px solid var(--orange);border-radius:14px;padding:6px 10px;color:var(--orange);font-size:22px;font-weight:900}.header-logo img{display:block;width:190px;max-width:45vw;height:auto}.ibs-logo-wrap img{display:block;width:290px;max-width:75vw;height:auto}.header-title h1{margin:0;font-size:24px}.header-title div{font-size:13px;color:#bbb}.topActions{margin-left:auto;display:flex;flex-wrap:wrap;gap:5px}main{padding:18px;max-width:1350px;margin:auto}.hero{background:linear-gradient(120deg,#111 0%,#222 46%,rgba(255,106,0,.88) 100%);color:white;border-radius:26px;padding:24px;margin-bottom:16px;box-shadow:0 13px 35px #0002;position:relative;overflow:hidden}.hero:after{content:'⚙️';position:absolute;right:35px;top:15px;font-size:120px;opacity:.12}.hero h2{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#e9e9e9}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:white;color:#222;border:1px solid var(--line)}.tab.active{background:var(--orange);color:white}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px #0001}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px #0001}.kpi b{font-size:28px;display:block;color:var(--orange)}.status{display:inline-block;color:white;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px}.Reportado{background:var(--red)}.Asignado{background:var(--yellow)}.Enatencion{background:var(--blue)}.Pendientevalidacion{background:var(--purple)}.Devuelto{background:#97266d}.Liberado{background:var(--green)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;font-size:14px}th{background:#f8fafc}.empty{padding:22px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:18px;color:#666}.bar{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange)}.searchbox{display:flex;gap:10px;align-items:center;margin:12px 0}.searchbox input{flex:1}.asset-results{background:#fff;border:1px solid var(--line);border-radius:16px;max-height:280px;overflow:auto;margin-top:8px}.asset-option{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.asset-option:hover{background:#fff7ef}.asset-option b{color:var(--orange)}.pill{display:inline-block;border-radius:999px;background:#eef1f4;padding:5px 8px;font-size:12px;margin:2px}.selected-asset{background:#fff7ef;border:1px solid #ffc18d;border-radius:16px;padding:12px;margin-top:10px}.time-box-mtto{background:#eef6ff;border:1px solid #b8dcff;border-radius:14px;padding:10px;margin-bottom:8px}.time-box-prod{background:#fff4e6;border:1px solid #ffd59b;border-radius:14px;padding:10px;margin-bottom:8px}.time-box-total{background:#f8fafc;border:1px solid #d8dde3;border-radius:14px;padding:10px}.time-box-mtto b,.time-box-prod b,.time-box-total b{font-size:16px}@media(max-width:950px){.login-page{grid-template-columns:1fr}.login-left{padding:35px 24px 10px}.login-title{font-size:40px}.machine-strip,.kpis,.grid,.grid3,.grid4{grid-template-columns:1fr}.topActions{margin-left:0}header{flex-wrap:wrap}.searchbox{display:block}}

.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:9999}.loading-box{background:white;color:#222;padding:26px;border-radius:22px;min-width:260px;text-align:center;box-shadow:0 25px 80px #0009;border-top:7px solid var(--orange)}.spinner{width:48px;height:48px;border:5px solid #eee;border-top:5px solid var(--orange);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button:disabled{opacity:.65;cursor:not-allowed}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:10000;padding:18px}.modal-card{background:#fff;border-radius:24px;padding:22px;max-width:620px;width:100%;box-shadow:0 25px 90px #0009;border-top:8px solid var(--orange)}.modal-card h2{margin:0 0 8px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice-box{background:#fff7ef;border:1px solid #ffc18d;border-radius:16px;padding:12px;margin-top:10px}

/* MEJORAS AUTORIZADAS: vista más limpia sin quitar funciones */
.kpi b small{font-size:13px;color:#666;display:block;font-weight:700;margin-top:2px}.time-compact{font-size:18px;font-weight:900;color:#111}.time-detail{font-size:12px;color:#666;margin-top:3px}.stats-list{display:grid;gap:8px}.stat-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef1f4;padding:7px 0}.stat-row b{color:#222}.stat-row span{background:#fff7ef;border:1px solid #ffc18d;border-radius:999px;padding:3px 8px;font-weight:900;color:#b45309}.user-help{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.hidden-for-area{opacity:.72}


/* MODULO AUTORIZADO: préstamo de unidades */
.fuel-wrap{background:#101010;border:4px solid #2b2b2b;border-radius:26px;padding:22px;color:#fff;text-align:center;margin:14px 0}
.fuel-gauge{width:300px;height:220px;margin:0 auto;position:relative;background:radial-gradient(circle,#222 0%,#111 58%,#050505 61%,#000 100%);border-radius:50%;box-shadow:inset 0 0 30px #000,0 8px 26px #0006}
.fuel-mark{position:absolute;font-weight:900;color:white;font-size:28px;text-shadow:0 2px 5px #000}.fuel-e{left:58px;bottom:62px}.fuel-q{left:72px;top:93px}.fuel-h{left:138px;top:53px}.fuel-tq{right:55px;top:93px}.fuel-f{right:64px;bottom:62px}.fuel-needle{position:absolute;width:118px;height:8px;background:#e51b24;border-radius:999px;left:150px;top:137px;transform-origin:0% 50%;transform:rotate(0deg);box-shadow:0 0 9px #000}.fuel-center{position:absolute;width:62px;height:62px;background:#444;border:8px solid #666;border-radius:50%;left:119px;top:108px}.fuel-slider{width:100%;accent-color:var(--orange);margin-top:18px}.unit-row-actions button{margin:3px}.loan-tech-row{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:13px;margin:8px 0}.unit-status{font-weight:900;color:var(--orange)}

<body>
<div id="loadingOverlay" class="loading-overlay"><div class="loading-box"><div class="spinner"></div><b id="loadingText">Cargando...</b><div class="muted" style="margin-top:8px">Por favor espera</div></div></div>

<header id="mainHeader" style="display:none"><div class="header-logo"><img src="/logo-interbandas.png" alt="Interbandas"></div><div class="header-title"><h1>MANTENIMIENTO IBS</h1><div id="userLabel">Sistema interno</div></div><div id="topActions" class="topActions"></div></header>
<main id="app"></main>
<script>
let me=null, activos=[], empleados=[], empleadosReportantes=[], tecnicos=[], gerentes=[], tickets=[], unidadPrestamos=[], reportes=null, catalogos={sucursales:[],areas:[]}, vista='panel', selectedAsset=null, selectedReporter=null, editingUserId=null;
const SUCURSALES_LOGIN_BASE=[
  'CHIHUAHUA','JUAREZ','TORREON','DURANGO','HERMOSILLO','MONTERREY','SALTILLO','CULIACAN','TIJUANA','MEXICALI','OBREGON','GUADALAJARA','MEXICO','QUERETARO','LEON','SAN LUIS POTOSI','PUEBLA','VERACRUZ','MERIDA','TAMPICO'
];
let SUCURSALES_LOGIN=[...SUCURSALES_LOGIN_BASE];
function loginSucursalOptions(){return SUCURSALES_LOGIN.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');}
async function cargarSucursalesLogin(){
  try{
    const r = await fetch('/api/sucursales-login');
    if(!r.ok) throw new Error('No se pudieron cargar sucursales');
    const data = await r.json();
    const extras = Array.isArray(data.sucursales) ? data.sucursales : [];
    SUCURSALES_LOGIN = [...new Set([...SUCURSALES_LOGIN_BASE, ...extras].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  }catch(e){
    SUCURSALES_LOGIN = [...SUCURSALES_LOGIN_BASE];
  }
}

const app=document.getElementById('app');
window.addEventListener('unhandledrejection', ev => {
  try{ hideLoading(); }catch(e){}
  console.error(ev.reason);
});
window.addEventListener('error', ev => {
  try{ hideLoading(); }catch(e){}
  console.error(ev.error || ev.message);
});
let loadingCount=0;
function showLoading(msg='Cargando...'){loadingCount++;const o=document.getElementById('loadingOverlay');const t=document.getElementById('loadingText');if(t)t.textContent=msg;if(o)o.style.display='flex'}
function hideLoading(){loadingCount=Math.max(0,loadingCount-1);if(loadingCount===0){const o=document.getElementById('loadingOverlay');if(o)o.style.display='none'}}
async function withLoading(msg, fn){showLoading(msg);try{return await fn()}finally{hideLoading()}}

function byId(id){return document.getElementById(id)}
function val(id){const el=byId(id);return el?el.value:''}
function filesOf(id){const el=byId(id);return el&&el.files?[...el.files]:[]}

function soloDigitos(v){
  return String(v||'').replace(/\D/g,'');
}
function telefonoWhats(v){
  let d=soloDigitos(v);
  if(!d) return '';
  if(d.length===10) d='52'+d;
  if(d.length===12 && d.startsWith('52')) return d;
  if(d.length>=11) return d;
  return d;
}
function mensajeTicket(t, titulo='Ticket de mantenimiento IBS'){
  return `${titulo}

Ticket: ${t.id || ''}
Activo: ${t.activo || ''} - ${t.activo_descripcion || ''}
Área: ${t.area || ''}
Ubicación: ${t.ubicacion || ''}
Prioridad: ${t.prioridad || ''}
Tipo falla: ${t.tipo_falla || ''}
Estado: ${t.estado || ''}

Falla:
${t.falla || ''}

Solicita: ${t.solicitante || ''}
Tel/ext: ${t.telefono_solicitante || ''}

Sistema:
${location.origin}`;
}
function buscarTecnico(username){
  return tecnicos.find(x=>String(x.username||'').toLowerCase()===String(username||'').toLowerCase()) || {};
}
function nombreTecnico(username){
  const t = buscarTecnico(username);
  return t.name || username || '';
}
function telefonoTecnico(username){
  const t = buscarTecnico(username);
  return t.telefono || '';
}
function mensajeTecnicoAsignado(t){
  return `MANTENIMIENTO IBS - TICKET ASIGNADO

Se te asignó un trabajo de mantenimiento.

Ticket: ${t.id || ''}
Activo: ${t.activo || ''} - ${t.activo_descripcion || ''}
Área: ${t.area || ''}
Ubicación: ${t.ubicacion || ''}
Prioridad: ${t.prioridad || ''}
Tipo de falla: ${t.tipo_falla || ''}

Falla reportada:
${t.falla || ''}

Solicita: ${t.solicitante || ''}
Tel/ext usuario: ${t.telefono_solicitante || ''}

Favor de entrar al sistema, iniciar atención y registrar diagnóstico/solución:
${location.origin}`;
}

function gerentesParaTicket(t){
  const rows = (gerentes || []).filter(g=>{
    const rol = String(g.role||'').toLowerCase();
    if(rol==='admin') return true;
    if(!t || !t.sucursal) return true;
    return sameKey(g.sucursal,t.sucursal) || esMatriz(g.sucursal) || !g.sucursal;
  });
  return rows.length ? rows : (gerentes || []);
}
function gerentePrincipal(t){
  return gerentesParaTicket(t)[0] || {};
}
function mensajeGerenteNuevoReporte(t){
  return `MANTENIMIENTO IBS - NUEVO REPORTE DE FALLA

Se levantó un nuevo reporte y requiere asignación de técnico.

Ticket: ${t.id || ''}
Activo: ${t.activo || ''} - ${t.activo_descripcion || ''}
Área: ${t.area || ''}
Sucursal: ${t.sucursal || ''}
Ubicación: ${t.ubicacion || ''}
Prioridad: ${t.prioridad || ''}
Tipo de falla: ${t.tipo_falla || ''}

Falla reportada:
${t.falla || ''}

Solicita: ${t.solicitante || ''}
Tel/ext usuario: ${t.telefono_solicitante || ''}

Favor de entrar al sistema para asignar el personal que atenderá el reporte:
${location.origin}`;
}
function abrirAvisoGerente(t){
  const g = gerentePrincipal(t);
  abrirWhatsApp(g.telefono || '', mensajeGerenteNuevoReporte(t));
}
function cerrarModalGerente(){
  const m = byId('modalGerente');
  if(m) m.remove();
}
function pantallaAvisoGerente(t){
  cerrarModalGerente();
  const g = gerentePrincipal(t);
  const div = document.createElement('div');
  div.id = 'modalGerente';
  div.className = 'modal-backdrop';
  div.innerHTML = `<div class="modal-card">
    <h2>Ticket creado correctamente</h2>
    <p class="muted">Ahora manda el aviso al gerente de mantenimiento para que entre al sistema y asigne al técnico.</p>
    <div class="notice-box">
      <b>Ticket:</b> ${esc(t.id)}<br>
      <b>Gerente/MTTO:</b> ${esc(g.name || g.username || 'Sin gerente configurado')}<br>
      <b>Activo:</b> ${esc(t.activo || '')} · ${esc(t.activo_descripcion || '')}<br>
      <b>Área:</b> ${esc(t.area || '')}<br>
      <b>Sucursal:</b> ${esc(t.sucursal || '')}
    </div>
    <div class="modal-actions">
      <button class="btn-green" type="button" onclick='abrirAvisoGerente(${JSON.stringify(t)})'>Avisar gerente de MTTO</button>
      <button class="btn-gray" type="button" onclick="cerrarModalGerente()">Cerrar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

function mensajeUsuarioConfirmacion(t){
  return `MANTENIMIENTO IBS - TICKET RECIBIDO

Hola ${t.solicitante || ''}, tu ticket ya fue recibido y asignado.

Ticket: ${t.id || ''}
Activo: ${t.activo || ''} - ${t.activo_descripcion || ''}
Área: ${t.area || ''}
Técnico asignado: ${nombreTecnico(t.tecnico_username) || t.tecnico_username || ''}

Falla reportada:
${t.falla || ''}

El técnico dará seguimiento y registrará la atención en el sistema.`;
}
function abrirWhatsApp(numero, mensaje){
  const tel=telefonoWhats(numero);
  const url = tel
    ? `https://wa.me/${tel}?text=${encodeURIComponent(mensaje)}`
    : `https://web.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
  window.open(url,'_blank');
}
function abrirAvisoTecnico(t){
  abrirWhatsApp(telefonoTecnico(t.tecnico_username), mensajeTecnicoAsignado(t));
}
function abrirConfirmacionUsuario(t){
  abrirWhatsApp(t.telefono_solicitante || '', mensajeUsuarioConfirmacion(t));
}
function cerrarModalAsignacion(){
  const m = byId('modalAsignacion');
  if(m) m.remove();
}
function pantallaMensajesAsignacion(t){
  cerrarModalAsignacion();
  const div = document.createElement('div');
  div.id = 'modalAsignacion';
  div.className = 'modal-backdrop';
  div.innerHTML = `<div class="modal-card">
    <h2>Ticket asignado correctamente</h2>
    <p class="muted">Ahora manda los mensajes por WhatsApp. Primero al técnico y después al usuario para confirmar que el ticket fue recibido.</p>
    <div class="notice-box">
      <b>Ticket:</b> ${esc(t.id)}<br>
      <b>Técnico:</b> ${esc(nombreTecnico(t.tecnico_username) || t.tecnico_username || '')}<br>
      <b>Usuario:</b> ${esc(t.solicitante || '')}<br>
      <b>Activo:</b> ${esc(t.activo || '')} · ${esc(t.activo_descripcion || '')}
    </div>
    <div class="modal-actions">
      <button class="btn-green" type="button" onclick='abrirAvisoTecnico(${JSON.stringify(t)})'>Mandar WhatsApp al técnico</button>
      <button class="btn-blue" type="button" onclick='abrirConfirmacionUsuario(${JSON.stringify(t)})'>Confirmar al usuario</button>
      <button class="btn-gray" type="button" onclick="cerrarModalAsignacion()">Cerrar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function btnWhatsTicket(t, titulo='Enviar WhatsApp'){
  const msg = mensajeTicket(t, titulo);
  const tel = t.telefono_solicitante || '';
  return `<button class="btn-green" type="button" onclick='abrirWhatsApp(${JSON.stringify(tel)}, ${JSON.stringify(msg)})'>WhatsApp</button>`;
}
function btnAvisosAsignacion(t){
  if(!t || !t.tecnico_username) return '';
  return `<div style="margin-top:8px">
    <button class="btn-green" type="button" onclick='abrirAvisoTecnico(${JSON.stringify(t)})'>Avisar técnico</button>
  </div>`;
}

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function fmt(d){return d?new Date(d).toLocaleString():'-'}
function sc(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll(' ','')}
function isAdmin(){return me && me.role==='admin'}
function canExport(){return me && (me.role==='admin' || me.can_export===true)}
function isGerencia(){return me && ['admin','gerente','mantenimiento'].includes(String(me.role||'').toLowerCase())}
function esTecnico(){return me && String(me.role||'').toLowerCase()==='tecnico'}
function puedeGestionarMtto(){return me && ['admin','gerente','mantenimiento','tecnico'].includes(String(me.role||'').toLowerCase())}
function puedeAceptarTicket(t){return puedeGestionarMtto() && (!t.tecnico_username || String(t.tecnico_username||'').toLowerCase()===String(me.username||'').toLowerCase() || isGerencia())}
function sameKey(a,b){return normalize(a)===normalize(b)}
function esMatriz(s){return sameKey(s,'CHIHUAHUA')}
function tecnicosParaTicket(t){return tecnicos.filter(x=>sameKey(x.sucursal,t.sucursal)||esMatriz(x.sucursal)||!t.sucursal)}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
const SUCURSAL_ALIAS_GROUPS_FRONT={
  'CHIHUAHUA':['CHIH','CHIH.','CHIHUAHUA','CUU','MATRIZ','IBS CHIHUAHUA','PLANTA CHIHUAHUA','SUCURSAL CHIHUAHUA'],
  'JUAREZ':['JRZ','JUAREZ','JUÁREZ','CD JUAREZ','CD. JUAREZ','CIUDAD JUAREZ','CIUDAD JUÁREZ','SUCURSAL JUAREZ'],
  'TIJUANA':['TJ','TIJ','TIJUANA','TIJUANA BC','TIJUANA B.C.','BC TIJUANA','SUCURSAL TIJUANA','PLANTA TIJUANA'],

const SUCURSAL_ALIASES_FRONT={};
Object.entries(SUCURSAL_ALIAS_GROUPS_FRONT).forEach(([canon,aliases])=>{
  SUCURSAL_ALIASES_FRONT[normalize(canon).replace(/[^a-z0-9]/g,'')]=canon;
  aliases.forEach(a=>SUCURSAL_ALIASES_FRONT[normalize(a).replace(/[^a-z0-9]/g,'')]=canon);
});
function normalizeKey(s){return normalize(s).replace(/[^a-z0-9]/g,'')}
function canonicalSucursalFront(s){const k=normalizeKey(s);return SUCURSAL_ALIASES_FRONT[k]||String(s||'').toUpperCase().trim()}
function sameLoose(a,b){return normalizeKey(canonicalSucursalFront(a))===normalizeKey(canonicalSucursalFront(b))}
function rolActual(){return String(me?.role||'').toLowerCase()}
function esUsuarioArea(){return ['operaciones','usuario_area','usuario'].includes(rolActual())}

function perteneceASucursalArea(row){
  if(!me) return false;
  if(puedeVerTodoFrontend()) return true;

  // ACTIVOS/HERRAMIENTAS:
  // Aquí se filtra SOLO por sucursal.
  // No por área, porque el Excel puede traer áreas como TOOL CRIB, TALLER, PRODUCCION, etc.
  // Si filtramos por área, el panel puede decir "315 activos visibles" pero el buscador no despliega nada.
  return !me.sucursal || sameLoose(row?.sucursal||'', me.sucursal||'');
}

  return sameLoose(t.sucursal||'', me.sucursal||'') && sameLoose(t.area||'', me.area_asignada||'');
})}
function fmtMin(min){

}

async function api(url,opts={}){
  const r = await fetch(url,opts);
  const raw = await r.text();
  let data = null;

  try{
    data = raw ? JSON.parse(raw) : null;
  }catch(e){
    data = raw;
  }

  if(!r.ok){
    const msg = (data && data.error) ? data.error : (typeof data === 'string' ? data : 'Error del servidor');
    throw new Error(msg);
  }

  return data;
}

function fuelAngle(pct){return -150 + (Number(pct||0)*300/100)}
function updateFuelGauge(prefix='entrega'){
  const pct=Number(val(prefix+'Combustible')||0);
  const needle=byId(prefix+'Needle'); const label=byId(prefix+'FuelLabel');
  if(needle) needle.style.transform=`rotate(${fuelAngle(pct)}deg)`;
  if(label) label.textContent=pct+'%';
}
function fuelGauge(prefix='entrega', value=50){
  setTimeout(()=>updateFuelGauge(prefix),50);
  return `<div class="fuel-wrap"><h3>Nivel de combustible</h3><div class="fuel-gauge"><div class="fuel-mark fuel-e">E</div><div class="fuel-mark fuel-q">1/4</div><div class="fuel-mark fuel-h">1/2</div><div class="fuel-mark fuel-tq">3/4</div><div class="fuel-mark fuel-f">F</div><div id="${prefix}Needle" class="fuel-needle"></div><div class="fuel-center"></div></div><input class="fuel-slider" id="${prefix}Combustible" type="range" min="0" max="100" step="25" value="${value}" oninput="updateFuelGauge('${prefix}')"><h2 id="${prefix}FuelLabel">${value}%</h2><div class="muted" style="color:white">E=0% · 1/4=25% · 1/2=50% · 3/4=75% · F=100%</div></div>`
}
function unidadPrestamosView(){
  const admin=puedeGestionarUnidades();
  const rows=unidadPrestamos||[];
  return `<div class="card"><h2>Préstamo de unidades</h2><p class="muted">El área/técnico crea la solicitud. Mantenimiento asigna la unidad y llena checklist obligatorio.</p>${!admin?solicitudUnidadCard():solicitudesMttoPanel(rows)}</div><div class="card"><h2>${admin?'Solicitudes / control de unidades':'Mis solicitudes de préstamo'}</h2>${tablaPrestamosUnidad(rows,admin)}</div>`;
}
function solicitudUnidadCard(){
  return `<div class="notice-box"><b>Regla:</b> el solicitante no asigna unidad. Mantenimiento revisa disponibilidad y asigna la unidad.</div><div class="grid3"><div><label>Tipo de salida</label><select id="u_tipo_salida"><option>Servicio con técnicos</option><option>Entrega de material/bandas</option><option>Préstamo personal</option></select></div><div><label>Empresa que se visita</label><input id="u_empresa" placeholder="Empresa"></div><div><label>OP / referencia</label><input id="u_op" placeholder="OP o folio"></div></div><div class="grid"><div><label>Técnico/usuario recibe</label><input id="unidadEmpleadoSearch" oninput="buscarEmpleadoUnidad(this.value)" placeholder="Número de empleado o nombre"><input type="hidden" id="unidadEmpleadoId"><input type="hidden" id="unidadEmpleadoNombre"><input type="hidden" id="unidadEmpleadoNumero"><div id="unidadEmpleadoResults"></div></div><div><label>Cantidad técnicos</label><input id="u_cantidad_tecnicos" type="number" min="1" value="1"></div></div><div class="grid"><div><label>Foto de OP</label><input id="u_foto_op" type="file" accept="image/*"><div class="muted">El técnico solo toma foto de la OP.</div></div><div><label>Número/folio de licencia</label><input id="u_licencia_numero" placeholder="Número de licencia obligatorio"><label>Foto de licencia</label><input id="u_foto_licencia" type="file" accept="image/*"></div></div><label>¿Lleva remolque?</label><select id="u_lleva_remolque" onchange="byId('u_remolque_box').style.display=this.value==='SI'?'block':'none'"><option value="NO">No</option><option value="SI">Sí</option></select><div id="u_remolque_box" style="display:none"><label>Datos del remolque</label><textarea id="u_datos_remolque" placeholder="Eco, placas, descripción"></textarea></div><button class="btn-orange" onclick="crearSolicitudUnidad()">Crear solicitud de préstamo</button>`;
}
function solicitudesMttoPanel(rows){
  const pendientes=(rows||[]).filter(x=>['SOLICITADO','ASIGNADO','ENTREGADO','EN_SERVICIO'].includes(String(x.estado||'')));
  return `<div class="notice-box"><b>Mantenimiento:</b> asigna unidad, llena checklist entrega/recepción, fotos, firmas y percances.</div><p><b>${pendientes.length}</b> solicitudes activas.</p>`;
}
function tablaPrestamosUnidad(rows,admin){
  if(!rows.length)return `<div class="empty">Sin solicitudes de préstamo.</div>`;
  return `<table><thead><tr><th>Folio</th><th>Empresa / OP</th><th>Usuario/Técnico</th><th>Estado</th><th>Unidad asignada</th><th>Acciones</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.folio)}</b><br>${fmt(p.creado)}</td><td>${esc(p.empresa||'')}<br><span class="muted">${esc(p.op||'')}</span></td><td>${esc(p.tecnico_nombre||'')}<br><span class="muted">${esc(p.tecnico_numero||'')}</span></td><td><span class="status ${sc(p.estado)}">${esc(p.estado)}</span></td><td><b>${esc(p.unidad_asignada||'Pendiente Mtto')}</b></td><td class="unit-row-actions">${admin?accionesPrestamoUnidad(p):'<span class="muted">Seguimiento de solicitud</span>'}</td></tr>`).join('')}</tbody></table>`;
}
function accionesPrestamoUnidad(p){
  return `<button class="btn-blue" onclick="asignarUnidadPrestamo('${p.folio}')">Asignar unidad</button><button class="btn-blue" onclick="abrirChecklistUnidad('${p.folio}','ENTREGA')">Checklist entrega</button><button class="btn-green" onclick="abrirChecklistUnidad('${p.folio}','RECEPCION')">Checklist recepción</button><button class="btn-red" onclick="abrirPercanceUnidad('${p.folio}')">Percance/daño</button>`;
}
async function crearSolicitudUnidad(){
  if(!val('unidadEmpleadoNombre')) return alert('Selecciona el técnico/usuario desde la base de empleados.');
  if(!val('u_empresa')) return alert('Captura empresa.');
  if(!val('u_licencia_numero') && !filesOf('u_foto_licencia').length) return alert('Captura número de licencia o anexa foto de licencia.');
  const body={tipo_salida:val('u_tipo_salida'),empresa:val('u_empresa'),op:val('u_op'),tecnico_id:val('unidadEmpleadoId'),tecnico_nombre:val('unidadEmpleadoNombre'),tecnico_numero:val('unidadEmpleadoNumero'),cantidad_tecnicos:val('u_cantidad_tecnicos'),licencia_numero:val('u_licencia_numero'),lleva_remolque:val('u_lleva_remolque'),datos_remolque:val('u_datos_remolque')};
  try{showLoading('Creando solicitud...');await api('/api/unidad-prestamos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Solicitud creada. Mantenimiento asignará unidad.');await render();}catch(e){alert(e.message)}finally{hideLoading()}
}
async function asignarUnidadPrestamo(folio){
  const unidad=prompt('Unidad asignada por Mantenimiento (eco / placas / descripción)');
  if(!unidad)return;
  try{await api(`/api/unidad-prestamos/${encodeURIComponent(folio)}/asignar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad_asignada:unidad})});alert('Unidad asignada.');render();}catch(e){alert(e.message)}
}
function checklistItem(nombre,key){return `<div class="card" style="box-shadow:none"><h3>${nombre}</h3><label>Aplicabilidad</label><select id="${key}_aplica"><option value="SI">Sí aplica</option><option value="NO">No aplica</option></select><label><input type="checkbox" id="${key}_ok" style="width:auto"> Revisado / OK</label><label>Observaciones</label><input id="${key}_obs" placeholder="Observaciones"></div>`}
function abrirChecklistUnidad(folio,tipo){
  const div=document.createElement('div');div.className='modal-backdrop';div.id='modalChecklistUnidad';
  const prefix=tipo==='ENTREGA'?'entrega':'recepcion';
  div.innerHTML=`<div class="modal-card" style="max-width:1100px;max-height:92vh;overflow:auto"><h2>Checklist de ${tipo==='ENTREGA'?'entrega':'recepción'} · ${esc(folio)}</h2><p class="muted">Cada punto que Sí aplica debe quedar revisado. Firmas obligatorias.</p><div class="grid3"><div><label>KM ${tipo==='ENTREGA'?'inicial':'final'}</label><input id="chk_km" type="number"></div><div><label>Fecha/hora</label><input id="chk_fecha" value="${new Date().toLocaleString()}"></div><div><label>Observaciones generales</label><input id="chk_obs" placeholder="Observaciones"></div></div>${fuelGauge(prefix,50)}<h2>Checklist obligatorio</h2><div class="grid4">${checklistItem('Luces','luces')}${checklistItem('Intermitentes','intermitentes')}${checklistItem('Llanta extra','llanta_extra')}${checklistItem('Póliza de seguro','poliza')}${checklistItem('Nivel de agua','agua')}${checklistItem('Nivel de aceite','aceite')}${checklistItem('Líquido de frenos','frenos')}${checklistItem('Limpiaparabrisas','limpia')}${checklistItem('Condición interior','interior')}${checklistItem('Alarma de reversa','alarma')}${checklistItem('Torreta','torreta')}${checklistItem('Tacón','tacon')}${checklistItem('Cono de seguridad','cono')}${checklistItem('Pértiga','pertiga')}</div><div class="grid"><div><label>Número de póliza</label><input id="poliza_numero"></div><div><label>Vigencia póliza</label><input id="poliza_vigencia" type="date"></div></div><label>Fotos múltiples de ${tipo==='ENTREGA'?'entrega':'recepción'} / daños</label><input id="chk_fotos" type="file" multiple accept="image/*"><div class="grid"><div><label>Firma técnico/usuario</label><button class="btn-orange" onclick="marcarFirma('firma_tecnico')">Firmar / Procesar</button><input id="firma_tecnico" placeholder="Firma procesada" readonly></div><div><label>Firma mantenimiento</label><button class="btn-orange" onclick="marcarFirma('firma_mtto')">Firmar / Procesar</button><input id="firma_mtto" placeholder="Firma procesada" readonly></div></div><div class="modal-actions"><button class="btn-green" onclick="guardarChecklistUnidad('${folio}','${tipo}')">Guardar checklist</button><button class="btn-gray" onclick="byId('modalChecklistUnidad').remove()">Cerrar</button></div></div>`;
  document.body.appendChild(div);updateFuelGauge(prefix);
}
function marcarFirma(id){byId(id).value=(me.name||me.username)+' · '+new Date().toLocaleString()}
function leerChecklistPayload(prefix){
  const keys=['luces','intermitentes','llanta_extra','poliza','agua','aceite','frenos','limpia','interior','alarma','torreta','tacon','cono','pertiga'];
  const items={};
  for(const k of keys){items[k]={aplica:val(k+'_aplica'),ok:byId(k+'_ok')?.checked||false,obs:val(k+'_obs')}}
  return {km:val('chk_km'),fecha:val('chk_fecha'),observaciones:val('chk_obs'),combustible:Number(val(prefix+'Combustible')||0),items,poliza_numero:val('poliza_numero'),poliza_vigencia:val('poliza_vigencia'),firma_tecnico:val('firma_tecnico'),firma_mtto:val('firma_mtto')}
}
async function guardarChecklistUnidad(folio,tipo){
  const prefix=tipo==='ENTREGA'?'entrega':'recepcion'; const payload=leerChecklistPayload(prefix);
  if(!payload.km)return alert('KM obligatorio.');
  if(payload.items.poliza.aplica==='SI' && (!payload.poliza_numero || !payload.poliza_vigencia))return alert('Póliza obligatoria: número y vigencia.');
  for(const [k,it] of Object.entries(payload.items)){if(it.aplica==='SI' && !it.ok)return alert('Falta revisar: '+k)}
  if(!payload.firma_tecnico || !payload.firma_mtto)return alert('Firmas obligatorias.');
  try{await api(`/api/unidad-prestamos/${encodeURIComponent(folio)}/checklist`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo,...payload})});alert('Checklist guardado.');byId('modalChecklistUnidad').remove();render();}catch(e){alert(e.message)}
}
function abrirPercanceUnidad(folio){
  const div=document.createElement('div');div.className='modal-backdrop';div.id='modalPercanceUnidad';
  div.innerHTML=`<div class="modal-card"><h2>Reporte de percance / daño · ${esc(folio)}</h2><label>Descripción de hechos</label><textarea id="per_hechos"></textarea><label>Daños detectados</label><textarea id="per_danos"></textarea><label>Acciones tomadas / recomendadas</label><textarea id="per_acciones"></textarea><label>Fotos/evidencias</label><input id="per_fotos" type="file" multiple accept="image/*"><div class="grid"><div><label>Firma técnico/usuario</label><button class="btn-orange" onclick="marcarFirma('per_firma_tecnico')">Firmar</button><input id="per_firma_tecnico" readonly></div><div><label>Firma mantenimiento</label><button class="btn-orange" onclick="marcarFirma('per_firma_mtto')">Firmar</button><input id="per_firma_mtto" readonly></div></div><div class="modal-actions"><button class="btn-red" onclick="guardarPercanceUnidad('${folio}')">Guardar reporte / PDF futuro</button><button class="btn-gray" onclick="byId('modalPercanceUnidad').remove()">Cerrar</button></div></div>`;
  document.body.appendChild(div);
}
async function guardarPercanceUnidad(folio){
  if(!val('per_hechos'))return alert('Descripción de hechos obligatoria.');
  if(!val('per_firma_tecnico') || !val('per_firma_mtto'))return alert('Firmas obligatorias.');
  try{await api(`/api/unidad-prestamos/${encodeURIComponent(folio)}/percance`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hechos:val('per_hechos'),danos:val('per_danos'),acciones:val('per_acciones'),firma_tecnico:val('per_firma_tecnico'),firma_mtto:val('per_firma_mtto')})});alert('Reporte guardado.');byId('modalPercanceUnidad').remove();render();}catch(e){alert(e.message)}
}

boot();
