<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mantenimiento IBS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  display: flex;
  align-items: center;
  padding: 15px 30px;
  background: black;
  border-bottom: 2px solid orange;
}

.logo-img {
  height: 60px;
  margin-right: 15px;
  filter: drop-shadow(0 0 8px rgba(255,102,0,0.5));
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.hero {
  padding: 60px 40px;
  background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(255,102,0,0.4)), url('https://images.unsplash.com/photo-1581091870627-3c1a4e4f9a6b');
  background-size: cover;
}

.hero h1 {
  font-size: 48px;
}

.hero span {
  color: orange;
}

.cards {
  display: flex;
  gap: 20px;
  padding: 40px;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 20px;
  flex: 1;
  min-width: 200px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

.card:hover {
  border: 1px solid orange;
}

.login {
  padding: 40px;
}

input {
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 10px 20px;
  background: orange;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
</style>

</head>

<body>

<header>
  <img src="logo-interbandas.png" class="logo-img">
  <div class="title">MANTENIMIENTO IBS</div>
</header>

<section class="hero">
  <h1>Sistema de <span>Mantenimiento IBS</span></h1>
  <p>Control de tickets, activos, empleados y tiempos muertos</p>
</section>

<section class="cards">
  <div class="card">
    <h3>Maquinaria</h3>
    <p>Activos industriales</p>
  </div>

  <div class="card">
    <h3>Herramientas</h3>
    <p>Inventario y uso</p>
  </div>

  <div class="card">
    <h3>Mantenimiento</h3>
    <p>Tickets y fallas</p>
  </div>

  <div class="card">
    <h3>Control</h3>
    <p>Reportes y tiempos</p>
  </div>
</section>

<section class="login">
  <h2>Iniciar sesión</h2>

  <input type="text" id="usuario" placeholder="Usuario" autocomplete="off">
  <input type="password" id="password" placeholder="Contraseña" autocomplete="off">

  <br>
  <button onclick="login()">Entrar</button>
</section>

<script>
async function login() {
  const usuario = document.getElementById('usuario').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario, password })
  });

  const data = await res.json();

  if (data.ok) {
    location.reload();
  } else {
    alert('Error de login');
  }
}
</script>

</body>
</html>
